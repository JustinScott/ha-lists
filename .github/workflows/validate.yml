name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which tests to run'
        required: true
        type: choice
        default: all
        options:
          - all
          - pytest
          - behavioral
          - browser
permissions:
  contents: read
jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/ha_lists/frontend/panel.js
  home-assistant:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'pytest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
  hassfest:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
  behavioral:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'behavioral'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  secret-scan:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
