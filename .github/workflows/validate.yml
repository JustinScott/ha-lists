name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/ha_lists/frontend/panel.js
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio pytest-homeassistant-custom-component home-assistant-frontend
      - run: python -m pytest -q tests_ha
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component home-assistant-frontend
      - run: python -m pytest -q tests_ha --cov=custom_components.ha_lists --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
