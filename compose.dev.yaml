services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./.dev-config:/config
      - ./dev/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components/ha_lists:/config/custom_components/ha_lists:ro
